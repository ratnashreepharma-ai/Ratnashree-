name: Build Signed Ratnashree Pharma APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          rm -rf source
          mkdir source
  
          echo "Using: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

      - name: Fix project settings
        run: |
          cp gradle.properties source/gradle.properties
          sed -i 's/android { /android { /' source/app/build.gradle.kts || true

      - name: Decode permanent signing key
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > source/ratnashree-release.jks

      - name: Build signed APK
        working-directory: source
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ratnashree-pharma-signed-apk
          path: source/app/build/outputs/apk/release/*.apk
