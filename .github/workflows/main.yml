name: Build Ratnashree Pharma APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir source
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          unzip -q "$ZIP_FILE" -d source
          echo "Extracted:"
          find source -maxdepth 2 -type f | head -50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd source
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RatnashreePharma-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
