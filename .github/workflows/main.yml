name: Build Ratnashree Pharma APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          rm -rf source
          mkdir source
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -1)
          unzip -q "$ZIP_FILE" -d source

      - name: Fix Gradle properties
        run: |
          cp "$GITHUB_WORKSPACE/gradle.properties" "$GITHUB_WORKSPACE/source/gradle.properties"

      - name: Fix Java and Kotlin JVM target
        run: |
          sed -i '/android {/a\
              compileOptions {\
                  sourceCompatibility = JavaVersion.VERSION_17\
                  targetCompatibility = JavaVersion.VERSION_17\
              }' source/app/build.gradle.kts

          sed -i '/android {/a\
              kotlinOptions {\
                  jvmTarget = "17"\
              }' source/app/build.gradle.kts

      - name: Build APK
        working-directory: source
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ratnashree-pharma-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
