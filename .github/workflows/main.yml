name: Create Permanent Signing Key

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore ratnashree-release.jks \
            -alias ratnashree \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_KEY_PASSWORD }}" \
            -dname "CN=Ratnashree Pharma, O=Ratnashree Pharma, C=IN"

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: ratnashree-signing-key
          path: ratnashree-release.jks
